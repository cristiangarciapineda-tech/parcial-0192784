<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Launch UI</title>
</head>
<body>
<div class="phone">

    <header>
        <div class="container navbar__inner">
            <a href="#" class="logo">
                <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M3 21 11 13" />
                    <path d="M7 21 19 9" />
                    <path d="M13 21 19 15" />
                    <path d="M13 4h7v7" />
                </svg>
                Launch UI
            </a>


</div>
    <main>
    <div class="container hero__content">

        <p class="badge">
            <span class="badge__text">New version of Launch UI is out!</span>
            <a href="#" class="badge__link">Read more
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
            </a>
        </p>

        <h1 class="hero__title">
            <span>Give your big idea the website it deserves</span>
        </h1>

        <p class="hero__description">
            Landing page kit template with React,
            Shadcn/ui and Tailwind that you can
            copy/paste into your project.
        </p>

        <div class="hero__buttons">
        <a href="#preview" class="btn btn--light btn--lg">Get started</a>
        <a href="https://github.com/" class="btn btn--dark btn--lg">Github</a>
        </div>
    </div>

    <div class="preview" id="preview">
        <div class="preview__glow" aria-hidden="true"></div>

            <div class="toolbar">
                <div class="toolbar__colors" aria-label="Colores (decorativo)">
                    <button type="button" class="dot dot--orange is-active" tabindex="-1"></button>
                    <button type="button" class="dot dot--rose" tabindex="-1"></button>
                    <button type="button" class="dot dot--violet" tabindex="-1"></button>
                    <button type="button" class="dot dot--blue" tabindex="-1"></button>
                    <button type="button" class="dot dot--green" tabindex="-1"></button>
                </div>

                <span class="toolbar__sep"></span>

                <div class="toolbar__devices">
                    <button type="button" class="device-btn" tabindex="-1" title="Escritorio">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
                    </button>
                    <button type="button" class="device-btn" tabindex="-1" title="Tablet">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="4" y="2" width="16" height="20" rx="2"/><path d="M12 18h.01"/></svg>
                    </button>
                    <button type="button" class="device-btn is-active" tabindex="-1" title="Celular">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="6" y="2" width="12" height="20" rx="2"/><path d="M12 18h.01"/></svg>
                    </button>
                </div>


</main>

</body>
</html>
